<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-Side Market Research &amp; Property Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <img src="bside-logo.svg" alt="B-side" class="brand-logo">
    <div>
      <h1>Market Research <em>&amp; Property Intelligence</em></h1>
      <p class="sub">Fact-check, edit and publish B-Side market reports</p>
    </div>
    <div class="version-wrap">
      <span class="version-badge" id="version-badge"></span>
      <button id="btn-changelog" class="changelog-btn" title="Version history">?</button>
    </div>
  </div>
  <div class="actions">
    <button id="btn-back-universe" class="ghost">&larr; B-Side Universe</button>
    <div id="user-badge" class="user-badge"></div>
  </div>
</header>

<!-- ===== Reports list ===== -->
<main id="view-reports">
  <section class="toolbar">
    <h2>Reports</h2>
  </section>
  <div id="reports-grid" class="reports-grid"></div>
</main>

<!-- ===== Report detail: version history ===== -->
<main id="view-detail" hidden>
  <section class="toolbar">
    <button id="btn-back-reports" class="ghost">&larr; All reports</button>
    <h2 id="detail-title"></h2>
    <span class="spacer"></span>
    <button id="btn-new-draft" class="ghost admin-only" hidden>New draft (no AI)</button>
    <button id="btn-run-factcheck" class="primary admin-only">Run fact-check</button>
    <button id="btn-regenerate" class="primary admin-only">Regenerate report</button>
  </section>
  <div id="version-list" class="version-list"></div>
</main>

<!-- ===== Editor ===== -->
<main id="view-editor" hidden class="editor-main">
  <section class="editor-toolbar">
    <button id="btn-editor-back" class="ghost btn-sm">&larr; Versions</button>
    <span class="editor-title" id="editor-report-title"></span>
    <span class="toolbar-divider"></span>
    <button id="btn-bold" class="ghost btn-sm" title="Bold"><b>B</b></button>
    <button id="btn-italic" class="ghost btn-sm" title="Italic"><i>I</i></button>
    <select id="style-select" class="ghost btn-sm"></select>
    <button id="btn-clear-format" class="ghost btn-sm">Clear formatting</button>
    <span class="toolbar-divider"></span>
    <button id="btn-duplicate-block" class="ghost btn-sm" title="Duplicate the row/card/tile under the cursor">Duplicate block</button>
    <button id="btn-delete-block" class="ghost btn-sm" title="Delete the row/card/tile under the cursor">Delete block</button>
    <span class="spacer"></span>
    <span id="save-indicator" class="save-indicator"></span>
    <button id="btn-discard" class="ghost btn-sm">Discard changes</button>
    <button id="btn-save-draft" class="ghost btn-sm">Save draft</button>
    <button id="btn-publish" class="primary btn-sm">Publish this version</button>
  </section>
  <div class="editor-body">
    <iframe id="editor-frame" class="editor-frame" title="Report editor"></iframe>
    <aside id="factcheck-sidebar" class="factcheck-sidebar"></aside>
  </div>
</main>

<!-- ===== Changelog modal ===== -->
<div id="modal-changelog" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3>Version history</h3>
      <button class="modal-close" aria-label="Close">&times;</button>
    </div>
    <div id="changelog-body" class="modal-body"></div>
  </div>
</div>

<script src="changelog.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
